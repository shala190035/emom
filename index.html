<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>EMOM Tracker</title>
<style>
  :root {
    --bg: #0f0f0f;
    --surface: #1a1a1a;
    --surface2: #242424;
    --border: #2e2e2e;
    --text: #f0f0f0;
    --muted: #888;
    --accent: #c8f563;
    --danger: #ff5a5a;
    --warn: #f5a623;
    --blue: #5b9cf6;
    --radius: 14px;
    --font: 'DM Sans', system-ui, sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  body { background: var(--bg); color: var(--text); font-family: var(--font); min-height: 100vh; max-width: 480px; margin: 0 auto; padding-bottom: env(safe-area-inset-bottom, 24px); }
  @import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=DM+Mono:wght@400;500&display=swap');

  .nav { display: flex; background: var(--surface); border-bottom: 1px solid var(--border); position: sticky; top: 0; z-index: 10; }
  .nav-btn { flex: 1; padding: 12px 4px 10px; text-align: center; font-size: 10px; color: var(--muted); cursor: pointer; border: none; background: none; border-bottom: 2px solid transparent; font-family: var(--font); font-weight: 500; letter-spacing: .4px; text-transform: uppercase; transition: all .2s; display: flex; flex-direction: column; align-items: center; gap: 3px; }
  .nav-btn svg { width: 20px; height: 20px; stroke: currentColor; fill: none; stroke-width: 1.8; }
  .nav-btn.active { color: var(--accent); border-bottom-color: var(--accent); }

  .screen { display: none; padding: 20px 16px; }
  .screen.active { display: block; }

  .card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 16px; margin-bottom: 12px; }
  .card-title { font-size: 11px; font-weight: 600; letter-spacing: 1px; text-transform: uppercase; color: var(--muted); margin-bottom: 14px; }

  label { font-size: 12px; color: var(--muted); display: block; margin-bottom: 5px; }
  input[type=text], input[type=number], input[type=time], textarea, select {
    width: 100%; background: var(--surface2); border: 1px solid var(--border); border-radius: 10px;
    color: var(--text); font-family: var(--font); font-size: 15px; padding: 11px 13px;
    margin-bottom: 14px; outline: none; transition: border-color .2s;
  }
  textarea { resize: none; height: 80px; }
  select { appearance: none; }
  input:focus, textarea:focus, select:focus { border-color: var(--accent); }
  input::placeholder, textarea::placeholder { color: #444; }
  input[type=time]::-webkit-calendar-picker-indicator { filter: invert(1); opacity: 0.5; }

  .btn { width: 100%; padding: 14px; border-radius: 12px; font-size: 15px; font-weight: 600; font-family: var(--font); cursor: pointer; border: 1px solid var(--border); background: var(--surface2); color: var(--text); transition: all .15s; display: flex; align-items: center; justify-content: center; gap: 8px; }
  .btn:active { transform: scale(0.97); opacity: .85; }
  .btn-accent { background: var(--accent); color: #000; border: none; font-weight: 700; }
  .btn-danger { color: var(--danger); border-color: #3a1a1a; background: #1e1010; }
  .btn-blue { background: var(--blue); color: #000; border: none; font-weight: 700; }
  .btn-sm { width: auto; padding: 7px 13px; font-size: 13px; border-radius: 9px; }

  .ex-row { display: flex; gap: 8px; align-items: center; margin-bottom: 10px; }
  .ex-row input { margin: 0; flex: 1; }
  .ex-row input.reps-in { max-width: 72px; text-align: center; font-family: 'DM Mono', monospace; }
  .ex-del { background: none; border: 1px solid #2a1a1a; color: #555; width: 36px; height: 36px; border-radius: 9px; display: flex; align-items: center; justify-content: center; cursor: pointer; flex-shrink: 0; font-size: 18px; transition: all .15s; }
  .ex-del:active { color: var(--danger); }

  .timer-wrap { display: flex; flex-direction: column; align-items: center; padding: 10px 0 20px; }
  .round-label { font-size: 12px; letter-spacing: 1.5px; text-transform: uppercase; color: var(--muted); margin-bottom: 24px; font-weight: 600; }
  .ring-container { position: relative; width: 200px; height: 200px; margin-bottom: 24px; }
  .ring-container svg { transform: rotate(-90deg); }
  .ring-inner { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; }
  .timer-num { font-family: 'DM Mono', monospace; font-size: 56px; font-weight: 500; line-height: 1; }
  .timer-phase { font-size: 11px; letter-spacing: 1.5px; text-transform: uppercase; color: var(--muted); margin-top: 4px; }
  .ex-name-big { font-size: 26px; font-weight: 600; text-align: center; margin-bottom: 4px; }
  .ex-reps-big { font-size: 15px; color: var(--muted); text-align: center; margin-bottom: 24px; }
  .timer-btns { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; width: 100%; }

  .done-wrap { text-align: center; padding: 30px 0; }
  .done-icon { font-size: 56px; margin-bottom: 12px; }
  .done-title { font-size: 24px; font-weight: 700; margin-bottom: 6px; color: var(--accent); }
  .done-sub { color: var(--muted); font-size: 14px; margin-bottom: 28px; }

  /* MOOD PICKER */
  .mood-row { display: flex; gap: 8px; margin-bottom: 14px; }
  .mood-btn { flex: 1; padding: 10px 4px; border-radius: 10px; border: 1px solid var(--border); background: var(--surface2); cursor: pointer; text-align: center; font-size: 22px; transition: all .15s; }
  .mood-btn.selected { border-color: var(--accent); background: #1f2a0a; }
  .mood-btn:active { transform: scale(0.93); }

  /* WO EXERCISE ROWS */
  .wo-ex-block { background: var(--surface2); border: 1px solid var(--border); border-radius: 10px; padding: 12px; margin-bottom: 10px; }
  .wo-ex-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
  .wo-ex-name { font-size: 14px; font-weight: 600; }
  .wo-set-row { display: flex; gap: 8px; margin-bottom: 8px; align-items: center; }
  .wo-set-row input { margin: 0; flex: 1; font-size: 14px; padding: 8px 10px; }
  .wo-set-label { font-size: 11px; color: var(--muted); text-align: center; min-width: 30px; }

  /* HIST */
  .hist-item { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 14px 16px; margin-bottom: 10px; }
  .hist-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 6px; }
  .hist-name { font-size: 16px; font-weight: 600; }
  .hist-date { font-size: 11px; color: var(--muted); font-family: 'DM Mono', monospace; }
  .hist-meta { font-size: 12px; color: var(--muted); margin-bottom: 8px; }
  .tags { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
  .tag { background: var(--surface2); border: 1px solid var(--border); border-radius: 6px; padding: 3px 10px; font-size: 12px; color: #ccc; font-family: 'DM Mono', monospace; }
  .tag-mood { font-size: 14px; padding: 2px 8px; }
  .empty-state { text-align: center; color: var(--muted); font-size: 14px; padding: 48px 0; line-height: 1.8; }
  .section-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; }
  .hist-type-badge { font-size: 10px; padding: 2px 8px; border-radius: 20px; font-weight: 600; letter-spacing: .5px; }
  .badge-emom { background: #1f2a0a; color: var(--accent); }
  .badge-workout { background: #0d1e35; color: var(--blue); }
  .time-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .time-row > div input { margin-bottom: 0; }
</style>
</head>
<body>

<nav class="nav">
  <button class="nav-btn active" onclick="nav('setup')" id="nav-setup">
    <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 1v4M12 19v4M4.22 4.22l2.83 2.83M16.95 16.95l2.83 2.83M1 12h4M19 12h4M4.22 19.78l2.83-2.83M16.95 7.05l2.83-2.83"/></svg>
    EMOM
  </button>
  <button class="nav-btn" onclick="nav('timer')" id="nav-timer">
    <svg viewBox="0 0 24 24"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l2.5 2.5M8.56 2.75l4.13-.88M15.44 2.75l-4.13-.88"/></svg>
    Timer
  </button>
  <button class="nav-btn" onclick="nav('workout')" id="nav-workout">
    <svg viewBox="0 0 24 24"><path d="M6.5 6.5h11M6.5 12h11M6.5 17.5h5M3 6.5h.01M3 12h.01M3 17.5h.01"/></svg>
    Workout
  </button>
  <button class="nav-btn" onclick="nav('history')" id="nav-history">
    <svg viewBox="0 0 24 24"><path d="M3 3v18h18"/><path d="M7 16l4-4 4 4 4-4"/></svg>
    Verlauf
  </button>
</nav>

<!-- EMOM SETUP -->
<div id="screen-setup" class="screen active">
  <div class="card">
    <div class="card-title">EMOM Workout</div>
    <label>Name</label>
    <input type="text" id="wname" placeholder="z.B. Montag Kraft">
    <label>Dauer in Minuten (= Runden)</label>
    <input type="number" id="wduration" value="10" min="1" max="60">
  </div>
  <div class="card">
    <div class="section-row">
      <div class="card-title" style="margin:0">Übungen</div>
      <button class="btn btn-sm" onclick="addEx()">+ Hinzufügen</button>
    </div>
    <div id="ex-list"><div class="empty-state">Noch keine Übungen</div></div>
  </div>
  <button class="btn btn-accent" onclick="startWorkout()">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polygon points="5 3 19 12 5 21 5 3"/></svg>
    EMOM starten
  </button>
</div>

<!-- TIMER -->
<div id="screen-timer" class="screen">
  <div id="timer-content">
    <div class="timer-wrap">
      <div class="round-label" id="round-label">Runde 1 / 10</div>
      <div class="ring-container">
        <svg width="200" height="200">
          <circle cx="100" cy="100" r="88" fill="none" stroke="#222" stroke-width="10"/>
          <circle id="ring" cx="100" cy="100" r="88" fill="none" stroke="#c8f563" stroke-width="10"
            stroke-dasharray="552.9" stroke-dashoffset="0" stroke-linecap="round"
            style="transition: stroke-dashoffset .8s linear, stroke .3s"/>
        </svg>
        <div class="ring-inner">
          <div class="timer-num" id="timer-num">60</div>
          <div class="timer-phase" id="timer-phase">bereit</div>
        </div>
      </div>
      <div class="ex-name-big" id="ex-name">—</div>
      <div class="ex-reps-big" id="ex-reps"></div>
      <div class="timer-btns">
        <button class="btn" id="pause-btn" onclick="togglePause()">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/></svg>
          Pause
        </button>
        <button class="btn btn-danger" onclick="stopWorkout()">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/></svg>
          Beenden
        </button>
      </div>
    </div>
  </div>
</div>

<!-- WORKOUT TRACKER -->
<div id="screen-workout" class="screen">
  <div class="card">
    <div class="card-title">Workout eintragen</div>
    <label>Name</label>
    <input type="text" id="wo-name" placeholder="z.B. Push Day">

    <label>Datum</label>
    <input type="text" id="wo-date" placeholder="TT.MM.JJJJ">

    <div class="time-row">
      <div>
        <label>Von</label>
        <input type="time" id="wo-from">
      </div>
      <div>
        <label>Bis</label>
        <input type="time" id="wo-to">
      </div>
    </div>
  </div>

  <div class="card">
    <div class="card-title">Gefühl</div>
    <div class="mood-row" id="mood-row">
      <button class="mood-btn" onclick="selectMood('😞','this')" data-mood="😞">😞</button>
      <button class="mood-btn" onclick="selectMood('😐','this')" data-mood="😐">😐</button>
      <button class="mood-btn" onclick="selectMood('🙂','this')" data-mood="🙂">🙂</button>
      <button class="mood-btn" onclick="selectMood('💪','this')" data-mood="💪">💪</button>
      <button class="mood-btn" onclick="selectMood('🔥','this')" data-mood="🔥">🔥</button>
    </div>
  </div>

  <div class="card">
    <div class="section-row">
      <div class="card-title" style="margin:0">Übungen</div>
      <button class="btn btn-sm" onclick="addWoEx()">+ Übung</button>
    </div>
    <div id="wo-ex-list"><div class="empty-state" style="padding:20px 0">Übung hinzufügen</div></div>
  </div>

  <div class="card">
    <div class="card-title">Notizen</div>
    <textarea id="wo-notes" placeholder="Wie war das Workout? Was war gut/schlecht?"></textarea>
  </div>

  <button class="btn btn-blue" onclick="saveWorkout()" style="margin-bottom:8px">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M19 21H5a2 2 0 01-2-2V5a2 2 0 012-2h11l5 5v11a2 2 0 01-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/></svg>
    Workout speichern
  </button>
</div>

<!-- HISTORY -->
<div id="screen-history" class="screen">
  <div id="hist-list"></div>
</div>

<script>
// ---- EMOM ----
let exercises = [], interval = null, paused = false;
let timeLeft = 60, currentRound = 0, totalRounds = 10;
let wName = '', exCounts = [], currentExIdx = 0;

function nav(tab) {
  ['setup','timer','workout','history'].forEach(t => {
    document.getElementById('screen-'+t).classList.toggle('active', t===tab);
    document.getElementById('nav-'+t).classList.toggle('active', t===tab);
  });
  if(tab==='history') renderHistory();
  if(tab==='workout') initWoDate();
}

function addEx(name='', reps=10) {
  exercises.push({ id: Date.now()+Math.random(), name, reps });
  renderEx();
}
function removeEx(id) { exercises = exercises.filter(e=>e.id!==id); renderEx(); }
function renderEx() {
  const el = document.getElementById('ex-list');
  if(!exercises.length) { el.innerHTML='<div class="empty-state">Noch keine Übungen</div>'; return; }
  el.innerHTML = exercises.map(e=>`
    <div class="ex-row">
      <input type="text" placeholder="Übung" value="${e.name}" oninput="upEx(${JSON.stringify(e.id)},'name',this.value)">
      <input type="number" class="reps-in" placeholder="Wdh" value="${e.reps}" oninput="upEx(${JSON.stringify(e.id)},'reps',this.value)" min="1">
      <button class="ex-del" onclick="removeEx(${JSON.stringify(e.id)})">×</button>
    </div>`).join('');
}
function upEx(id, field, val) {
  const ex = exercises.find(e=>e.id===id);
  if(ex) ex[field] = field==='reps' ? (parseInt(val)||1) : val;
}

function startWorkout() {
  if(!exercises.length) { alert('Bitte mindestens eine Übung hinzufügen!'); return; }
  getCtx();
  wName = document.getElementById('wname').value || 'Workout';
  totalRounds = parseInt(document.getElementById('wduration').value) || 10;
  exCounts = exercises.map(e=>({ name: e.name, reps: e.reps, rounds: 0 }));
  currentRound = 0; currentExIdx = 0; paused = false;
  clearInterval(interval);
  nav('timer');
  document.getElementById('timer-content').innerHTML = getTimerHTML();
  nextRound();
}

function getTimerHTML() {
  return `<div class="timer-wrap">
    <div class="round-label" id="round-label">Runde 1 / ${totalRounds}</div>
    <div class="ring-container">
      <svg width="200" height="200">
        <circle cx="100" cy="100" r="88" fill="none" stroke="#222" stroke-width="10"/>
        <circle id="ring" cx="100" cy="100" r="88" fill="none" stroke="#c8f563" stroke-width="10"
          stroke-dasharray="552.9" stroke-dashoffset="0" stroke-linecap="round"
          style="transition: stroke-dashoffset .8s linear, stroke .3s"/>
      </svg>
      <div class="ring-inner">
        <div class="timer-num" id="timer-num">60</div>
        <div class="timer-phase" id="timer-phase">bereit</div>
      </div>
    </div>
    <div class="ex-name-big" id="ex-name">—</div>
    <div class="ex-reps-big" id="ex-reps"></div>
    <div class="timer-btns">
      <button class="btn" id="pause-btn" onclick="togglePause()">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/></svg>
        Pause
      </button>
      <button class="btn btn-danger" onclick="stopWorkout()">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/></svg>
        Beenden
      </button>
    </div>
  </div>`;
}

function nextRound() {
  currentRound++;
  currentExIdx = (currentRound-1) % exercises.length;
  timeLeft = 60;
  updateDisplay();
  clearInterval(interval);
  interval = setInterval(tick, 1000);
}

let audioCtx = null;
function getCtx() {
  if(!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  if(audioCtx.state === 'suspended') audioCtx.resume();
  return audioCtx;
}
function beep(type) {
  try {
    const ctx = getCtx(); const vol = 2.0;
    if(type==='round') {
      [0,0.35,0.7].forEach((t,i) => {
        const o=ctx.createOscillator(), g=ctx.createGain();
        o.type='square'; o.connect(g); g.connect(ctx.destination);
        o.frequency.value = i===2 ? 1200 : 900;
        g.gain.setValueAtTime(vol, ctx.currentTime+t);
        g.gain.linearRampToValueAtTime(0, ctx.currentTime+t+0.28);
        o.start(ctx.currentTime+t); o.stop(ctx.currentTime+t+0.3);
      });
    } else if(type==='finish') {
      [0,0.3,0.6,0.9,1.2].forEach((t,i) => {
        const o=ctx.createOscillator(), g=ctx.createGain();
        o.type='square'; o.connect(g); g.connect(ctx.destination);
        o.frequency.value=[1047,988,880,784,660][i];
        g.gain.setValueAtTime(vol, ctx.currentTime+t);
        g.gain.linearRampToValueAtTime(0, ctx.currentTime+t+0.25);
        o.start(ctx.currentTime+t); o.stop(ctx.currentTime+t+0.28);
      });
    } else if(type==='warn') {
      [0,0.2].forEach(t => {
        const o=ctx.createOscillator(), g=ctx.createGain();
        o.type='square'; o.connect(g); g.connect(ctx.destination);
        o.frequency.value=1400;
        g.gain.setValueAtTime(vol, ctx.currentTime+t);
        g.gain.linearRampToValueAtTime(0, ctx.currentTime+t+0.15);
        o.start(ctx.currentTime+t); o.stop(ctx.currentTime+t+0.18);
      });
    }
  } catch(e) {}
}

function tick() {
  if(paused) return;
  timeLeft--;
  updateDisplay();
  if(timeLeft===3) beep('warn');
  if(timeLeft<=0) {
    beep('round');
    exCounts[currentExIdx].rounds++;
    if(currentRound>=totalRounds) finish();
    else nextRound();
  }
}

function updateDisplay() {
  const rl=document.getElementById('round-label'), tn=document.getElementById('timer-num');
  const tp=document.getElementById('timer-phase'), en=document.getElementById('ex-name');
  const er=document.getElementById('ex-reps'), ring=document.getElementById('ring');
  if(!rl) return;
  rl.textContent=`Runde ${currentRound} / ${totalRounds}`;
  tn.textContent=timeLeft;
  tp.textContent=timeLeft<=10?'gleich fertig':'übung';
  const ex=exercises[currentExIdx];
  en.textContent=ex?.name||'—';
  er.textContent=ex?`${ex.reps} Wiederholungen`:'';
  const circ=2*Math.PI*88, pct=timeLeft/60;
  ring.setAttribute('stroke-dashoffset', circ*(1-pct));
  ring.setAttribute('stroke', timeLeft<=10?'#f5a623':'#c8f563');
}

function togglePause() {
  paused=!paused;
  const btn=document.getElementById('pause-btn');
  btn.innerHTML=paused
    ? `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="5 3 19 12 5 21 5 3"/></svg> Weiter`
    : `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/></svg> Pause`;
}
function stopWorkout() { if(!confirm('Workout beenden und speichern?')) return; finish(); }
function finish() {
  clearInterval(interval);
  beep('finish');
  const entry = { id: Date.now(), type: 'emom', date: new Date().toLocaleDateString('de-AT'), name: wName, rounds: currentRound, exercises: exCounts.map(e=>({...e})) };
  saveHist(entry);
  document.getElementById('timer-content').innerHTML=`
    <div class="done-wrap">
      <div class="done-icon">💪</div>
      <div class="done-title">Fertig!</div>
      <div class="done-sub">${currentRound} Runden · ${wName}</div>
      <div class="tags" style="justify-content:center;margin-bottom:28px">
        ${exCounts.map(e=>`<span class="tag">${e.name} · ${e.reps} Wdh</span>`).join('')}
      </div>
      <button class="btn btn-accent" onclick="nav('setup')">Neues Workout</button>
    </div>`;
}

// ---- WORKOUT TRACKER ----
let woExercises = [];
let selectedMood = '';

function initWoDate() {
  const d = document.getElementById('wo-date');
  if(!d.value) d.value = new Date().toLocaleDateString('de-AT');
}

function selectMood(mood) {
  selectedMood = mood;
  document.querySelectorAll('.mood-btn').forEach(b => {
    b.classList.toggle('selected', b.dataset.mood === mood);
  });
}

function addWoEx() {
  const id = Date.now() + Math.random();
  woExercises.push({ id, name: '', sets: [{ reps: '', weight: '' }] });
  renderWoEx();
}

function removeWoEx(id) {
  woExercises = woExercises.filter(e => e.id !== id);
  renderWoEx();
}

function addSet(exId) {
  const ex = woExercises.find(e => e.id === exId);
  if(ex) { ex.sets.push({ reps: '', weight: '' }); renderWoEx(); }
}

function updateWoEx(id, field, val) {
  const ex = woExercises.find(e => e.id === id);
  if(ex) ex[field] = val;
}

function updateSet(exId, setIdx, field, val) {
  const ex = woExercises.find(e => e.id === exId);
  if(ex && ex.sets[setIdx]) ex.sets[setIdx][field] = val;
}

function renderWoEx() {
  const el = document.getElementById('wo-ex-list');
  if(!woExercises.length) { el.innerHTML='<div class="empty-state" style="padding:20px 0">Übung hinzufügen</div>'; return; }
  el.innerHTML = woExercises.map((ex, ei) => `
    <div class="wo-ex-block">
      <div class="wo-ex-header">
        <input type="text" placeholder="Übungsname" value="${ex.name}"
          oninput="updateWoEx(${JSON.stringify(ex.id)},'name',this.value)"
          style="margin:0;font-weight:600;font-size:14px;background:transparent;border:none;border-bottom:1px solid var(--border);border-radius:0;padding:4px 0;width:70%">
        <button class="ex-del" onclick="removeWoEx(${JSON.stringify(ex.id)})">×</button>
      </div>
      <div style="display:grid;grid-template-columns:30px 1fr 1fr;gap:6px;margin-bottom:6px">
        <div class="wo-set-label" style="padding-top:4px">#</div>
        <div class="wo-set-label">Wdh.</div>
        <div class="wo-set-label">kg</div>
      </div>
      ${ex.sets.map((s, si) => `
        <div style="display:grid;grid-template-columns:30px 1fr 1fr;gap:6px;margin-bottom:6px;align-items:center">
          <div class="wo-set-label">${si+1}</div>
          <input type="number" placeholder="12" value="${s.reps}" min="0"
            oninput="updateSet(${JSON.stringify(ex.id)},${si},'reps',this.value)"
            style="margin:0;padding:8px;font-size:14px;text-align:center">
          <input type="number" placeholder="0" value="${s.weight}" min="0" step="0.5"
            oninput="updateSet(${JSON.stringify(ex.id)},${si},'weight',this.value)"
            style="margin:0;padding:8px;font-size:14px;text-align:center">
        </div>`).join('')}
      <button class="btn btn-sm" onclick="addSet(${JSON.stringify(ex.id)})" style="margin-top:4px;font-size:12px;padding:6px 12px">
        + Satz
      </button>
    </div>`).join('');
}

function saveWorkout() {
  const name = document.getElementById('wo-name').value.trim();
  if(!name) { alert('Bitte einen Namen eingeben!'); return; }
  const entry = {
    id: Date.now(),
    type: 'workout',
    name,
    date: document.getElementById('wo-date').value || new Date().toLocaleDateString('de-AT'),
    from: document.getElementById('wo-from').value,
    to: document.getElementById('wo-to').value,
    mood: selectedMood,
    notes: document.getElementById('wo-notes').value,
    exercises: woExercises.map(e => ({ name: e.name, sets: [...e.sets] }))
  };
  saveHist(entry);
  // reset
  document.getElementById('wo-name').value = '';
  document.getElementById('wo-from').value = '';
  document.getElementById('wo-to').value = '';
  document.getElementById('wo-notes').value = '';
  woExercises = [];
  selectedMood = '';
  document.querySelectorAll('.mood-btn').forEach(b => b.classList.remove('selected'));
  renderWoEx();
  alert('Workout gespeichert!');
  nav('history');
}

// ---- SHARED HISTORY ----
function saveHist(entry) {
  const hist = getHist();
  hist.unshift(entry);
  try { localStorage.setItem('emom_hist', JSON.stringify(hist)); } catch(e) {}
}
function getHist() {
  try { return JSON.parse(localStorage.getItem('emom_hist') || '[]'); } catch { return []; }
}

function renderHistory() {
  const hist = getHist();
  const el = document.getElementById('hist-list');
  if(!hist.length) { el.innerHTML='<div class="empty-state">Noch keine Einträge</div>'; return; }
  el.innerHTML = hist.map(w => {
    if(w.type === 'emom') {
      return `<div class="hist-item">
        <div class="hist-header">
          <div>
            <span class="hist-type-badge badge-emom">EMOM</span>
            <div class="hist-name" style="margin-top:4px">${w.name}</div>
          </div>
          <div class="hist-date">${w.date}</div>
        </div>
        <div class="hist-meta">${w.rounds} Runden</div>
        <div class="tags">${w.exercises.map(e=>`<span class="tag">${e.name} · ${e.reps}</span>`).join('')}</div>
      </div>`;
    } else {
      const timeStr = w.from && w.to ? `${w.from} – ${w.to}` : w.from ? `ab ${w.from}` : '';
      return `<div class="hist-item">
        <div class="hist-header">
          <div>
            <span class="hist-type-badge badge-workout">WORKOUT</span>
            <div class="hist-name" style="margin-top:4px">${w.name} ${w.mood ? w.mood : ''}</div>
          </div>
          <div class="hist-date">${w.date}</div>
        </div>
        ${timeStr ? `<div class="hist-meta">${timeStr}</div>` : ''}
        <div class="tags">${w.exercises.map(e=>`<span class="tag">${e.name} ${e.sets.map((s,i)=>`${i+1}:${s.reps}×${s.weight}kg`).join(' ')}</span>`).join('')}</div>
        ${w.notes ? `<div style="font-size:13px;color:var(--muted);margin-top:8px;line-height:1.5">${w.notes}</div>` : ''}
      </div>`;
    }
  }).join('');
}

renderEx();
renderWoEx();
</script>
</body>
</html>
